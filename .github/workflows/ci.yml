name: CI

# This workflow deliberately contains no build or test logic of its own. Every check lives
# in tools/checks/ci_gate.ps1 so that a green run means the same thing on a runner as it
# does on a developer machine. Extend the script, not this file.
#
# Note: this repository currently has no git remote, so this workflow is dormant until a
# remote is attached. It is committed now so the gate is defined in one place from day one.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Superseded runs on the same ref are cancelled, except on master where every push is kept.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  gate:
    name: build + test (Windows x64)
    # Windows is required, not a preference: the App is WPF (net9.0-windows) and the
    # Nodes.Vision tests load the real x64 OpenCV native runtime.
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      # Harmless when the targeting pack is already on the image, and it keeps the App's
      # UseWPF requirement from being the first thing that fails on a fresh runner.
      - name: Ensure Windows Desktop workload
        run: dotnet workload install windowsdesktop --skip-sign-check
        continue-on-error: true

      - name: Show environment
        run: |
          Write-Host "runner : $env:RUNNER_OS $env:RUNNER_ARCH"
          Write-Host "branch : $env:GITHUB_REF_NAME  commit: $env:GITHUB_SHA"
          dotnet --info

      - name: Run delivery gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          # The gate defaults its WorkDirectory to $env:TEMP\halcon-ci-gate, but on a
          # runner the "user temp" (C:\Users\RUNNER~1\AppData\Local\Temp) is a different
          # directory from GitHub's runner.temp (D:\a\_temp). Pin it to runner.temp so the
          # artifact-upload steps below can reference the exact same location; relying on
          # env.TEMP there is a bug because the action's env context has no TEMP.
          & tools/checks/ci_gate.ps1 -WorkDirectory "${{ runner.temp }}\halcon-ci-gate"
          $code = $LASTEXITCODE

          # Mirror the gate output into the run summary so failures are readable without
          # opening the raw log.
          $gateLog = Join-Path "${{ runner.temp }}" 'halcon-ci-gate\gate-output.txt'
          if (Test-Path $gateLog) {
            "## Delivery gate" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            Get-Content $gateLog | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

          if ($code -ne 0) { Write-Host "gate failed with exit $code" -ForegroundColor Red; exit $code }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-trx
          # The gate writes TRX under WorkDirectory\results, not the WorkDirectory root.
          # A root-level glob silently matched nothing and the artifact never appeared.
          # · 门禁把 TRX 写到 WorkDirectory\results 子目录,根级 glob 会静默匹配不到。
          path: ${{ runner.temp }}\halcon-ci-gate\results\*.trx
          if-no-files-found: warn
          retention-days: 14

      - name: Upload publish output listing
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: publish-output
          path: ${{ runner.temp }}\halcon-ci-gate\publish
          if-no-files-found: ignore
          retention-days: 7
